name: Release

# Pushing a tag such as v0.2.0 builds a universal app, packs it into a disk image,
# publishes a GitHub release and points the Homebrew cask at it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # To start the workflow that publishes the update feed with the site.
  actions: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Check that the tag, the changelog and the bundle agree
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag $GITHUB_REF_NAME is not of the form v1.2.3"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          scripts/check-repo.sh

      - name: Test
        run: scripts/test.sh

      - name: Lint
        run: scripts/lint.sh

      - name: Build the universal app
        env:
          KEYFARI_SIGNING_P12: ${{ secrets.KEYFARI_SIGNING_P12 }}
          KEYFARI_SIGNING_PASSWORD: ${{ secrets.KEYFARI_SIGNING_PASSWORD }}
        run: |
          # With the project's certificate every release has the same signature, so macOS
          # keeps the permissions across updates. Without it the app is signed ad hoc.
          KEYFARI_SIGN_IDENTITY="$(scripts/import-signing-certificate.sh)"
          export KEYFARI_SIGN_IDENTITY
          KEYFARI_UNIVERSAL=1 KEYFARI_VERSION="$VERSION" scripts/bundle.sh release
          codesign --verify --deep --strict build/Keyfari.app
          codesign --display --requirements - build/Keyfari.app 2>&1 | grep -E "^designated" || true

      - name: Create the disk image
        run: scripts/make-dmg.sh build/Keyfari.app "build/Keyfari-$VERSION.dmg"

      - name: Write the release notes
        run: scripts/release-notes.sh "$VERSION" > build/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "build/Keyfari-$VERSION.dmg"
          --title "Keyfari $VERSION" --notes-file build/notes.md

      - name: Point the Homebrew cask and the update feed at the release
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # The disk image is kept aside: checking out main replaces the working tree's scripts.
          cp "build/Keyfari-$VERSION.dmg" "$RUNNER_TEMP/"
          git fetch origin main
          git checkout main
          scripts/publish-feed.sh "$VERSION" "$RUNNER_TEMP/Keyfari-$VERSION.dmg"
          git add Casks/keyfari.rb site/appcast.xml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "hz.kou"
          git config user.email "49755533+hodgekou@users.noreply.github.com"
          git commit -m "Point the cask and the update feed at $VERSION"
          git push origin main
          # A push made by a workflow does not start other workflows, so the site, which
          # carries the feed, is published by asking for it.
          gh workflow run site.yml --ref main

      - name: Copy the cask to the Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/sync-tap.sh
