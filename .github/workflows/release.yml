name: Release

# Pushing a tag such as v0.2.0 builds a universal app, packs it into a disk image,
# publishes a GitHub release and points the Homebrew cask at it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # To start the workflow that publishes the update feed with the site.
  actions: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Check that the tag, the changelog and the bundle agree
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag $GITHUB_REF_NAME is not of the form v1.2.3"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          scripts/check-repo.sh

      - name: Test
        run: scripts/test.sh

      - name: Lint
        run: scripts/lint.sh

      - name: Build the universal app
        run: KEYFARI_UNIVERSAL=1 KEYFARI_VERSION="$VERSION" scripts/bundle.sh release

      - name: Create the disk image
        run: scripts/make-dmg.sh build/Keyfari.app "build/Keyfari-$VERSION.dmg"

      - name: Write the release notes
        run: scripts/release-notes.sh "$VERSION" > build/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "build/Keyfari-$VERSION.dmg"
          --title "Keyfari $VERSION" --notes-file build/notes.md

      - name: Sign the update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Without the key the release still goes out; installed copies just do not learn of it.
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::No SPARKLE_PRIVATE_KEY secret, so this release is not added to the update feed"
            exit 0
          fi
          # The key goes in on standard input and never touches the disk or the log.
          signature="$(printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - -p "build/Keyfari-$VERSION.dmg")"
          echo "SIGNATURE=$signature" >> "$GITHUB_ENV"

      - name: Point the Homebrew cask and the update feed at the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(shasum -a 256 "build/Keyfari-$VERSION.dmg" | cut -d ' ' -f 1)"
          git fetch origin main
          git checkout main
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/keyfari.rb
          if [ -n "${SIGNATURE:-}" ]; then
            scripts/update-appcast.py "$VERSION" "build/Keyfari-$VERSION.dmg" "$SIGNATURE"
            git add site/appcast.xml
          fi
          if git diff --quiet HEAD; then exit 0; fi
          git config user.name "hz.kou"
          git config user.email "49755533+hodgekou@users.noreply.github.com"
          git commit -am "Point the cask and the update feed at $VERSION"
          git push origin main
          # A push made by a workflow does not start other workflows, so the site, which
          # carries the feed, is published by asking for it.
          gh workflow run site.yml --ref main
