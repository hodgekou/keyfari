name: Release

# Pushing a tag such as v0.2.0 builds a universal app, packs it into a disk image,
# publishes a GitHub release and points the Homebrew cask at it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: scripts/test.sh

      - name: Build the universal app
        run: KEYFARI_UNIVERSAL=1 KEYFARI_VERSION="$VERSION" scripts/bundle.sh release

      - name: Create the disk image
        run: scripts/make-dmg.sh build/Keyfari.app "build/Keyfari-$VERSION.dmg"

      - name: Write the release notes
        run: scripts/release-notes.sh "$VERSION" > build/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "build/Keyfari-$VERSION.dmg"
          --title "Keyfari $VERSION" --notes-file build/notes.md

      - name: Point the Homebrew cask at the release
        run: |
          sha="$(shasum -a 256 "build/Keyfari-$VERSION.dmg" | cut -d ' ' -f 1)"
          git fetch origin main
          git checkout main
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/keyfari.rb
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Point the cask at $VERSION"
          git push origin main
